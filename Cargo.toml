[package]
name = "mcp-server-gpui-docs"
version = "0.1.0"
edition = "2024"
description = "MCP server: search GPUI docs, book, tutorial, and official examples"

[dependencies]
rmcp = { version = "1.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"

[profile.release]
lto = true
strip = true
